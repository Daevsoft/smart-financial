<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="FinTrack — an offline personal finance tracker built with Jetz. All data stays in your browser's LocalStorage." />
    <meta name="theme-color" content="#84cc16" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/img/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />
    <title>FinTrack — Personal Finance Tracker</title>
    <script>
      try {
        var prefs = JSON.parse(localStorage.getItem("fintracker.prefs"));
        if (prefs && prefs.theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
